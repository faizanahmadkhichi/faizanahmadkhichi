<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Faizan Ahmad Khichi — Founder of FAK LABS</title>
  <desc id="desc">A Swiss-inspired dark banner introducing Faizan Ahmad Khichi as a software developer, AI engineer and product builder.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.48" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#080b14"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect x="0" y="0" width="18" height="360" rx="9" fill="url(#accent)"/>
  <circle cx="1070" cy="70" r="190" fill="#7c3aed" opacity=".13"/>
  <circle cx="1130" cy="310" r="160" fill="#06b6d4" opacity=".1"/>
  <text x="76" y="82" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="5">FAK LABS / BUILDING FOR THE REAL WORLD</text>
  <text x="72" y="174" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="800" letter-spacing="-2">FAIZAN AHMAD KHICHI</text>
  <text x="76" y="230" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="27" letter-spacing="1">SOFTWARE DEVELOPER  ·  AI ENGINEER  ·  PRODUCT BUILDER</text>
  <rect x="76" y="280" width="365" height="4" fill="url(#accent)"/>
  <text x="1000" y="300" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">FAK</text>
  <text x="1004" y="330" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="7">LABS</text>
</svg>
